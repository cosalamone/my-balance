<div
  *ngIf="config()?.show"
  class="mb-4 p-3 rounded-lg border transition-all duration-300"
  [ngClass]="getMessageClasses()">
  <div class="flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <mat-icon [ngClass]="getIconClasses()">
        {{ getIcon() }}
      </mat-icon>
      <span [ngClass]="getTextClasses()" class="text-sm">
        {{ config()?.message }}
      </span>
    </div>
    <mb-common-button
      *ngIf="config()?.dismissible"
      [buttonModel]="_dismissModel()"
      class="ml-4"></mb-common-button>
  </div>
</div>
