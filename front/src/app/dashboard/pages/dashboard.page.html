<div class="dashboard-layout container-app">
  <!-- Header Section -->
  <header class="dashboard-header">
    <mb-page-header
      title="💰 Dashboard Financiero"
      subtitle="Resumen completo de tu actividad financiera actual"></mb-page-header>
  </header>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner diameter="60" strokeWidth="4"></mat-spinner>
    <p class="loading-text">Cargando tu información financiera...</p>
  </div>

  <!-- Dashboard Content -->
  <main *ngIf="!isLoading" class="dashboard-main">
    <!-- Summary Cards Section -->
    <mb-dashboard-section title="📊 Resumen General">
      <mb-summary-cards [model]="summaryCardModel"></mb-summary-cards>
    </mb-dashboard-section>

    <!-- Quick Actions Section -->
    <mb-dashboard-section
      title="⚡ Acciones Rápidas"
      subtitle="Gestiona tus finanzas de forma rápida y eficiente">
      <mb-quick-actions-card></mb-quick-actions-card>
    </mb-dashboard-section>

    <!-- Activity Summary Section -->
    <mb-dashboard-section
      title="📈 Actividad Reciente"
      subtitle="Tu actividad financiera de los últimos días">
      <mb-activity-summary-card
        [summary]="currentSummary"
        (refreshClicked)="refreshData()"></mb-activity-summary-card>
    </mb-dashboard-section>
  </main>

  <!-- Footer -->
  <footer class="flex-shrink-0 py-3 px-2" *ngIf="!isLoading">
    <div class="text-center">
      <p class="text-xs text-gray-500">
        Última actualización: {{ lastUpdated | date: 'medium' : 'es' }}
      </p>
    </div>
  </footer>
</div>
