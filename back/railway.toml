# Railway Configuration for MyBalance Backend

# Railway will automatically detect this as a .NET project
# and use the Dockerfile to build and deploy

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "dotnet MyBalance.API.dll"
healthcheckPath = "/swagger/index.html"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
